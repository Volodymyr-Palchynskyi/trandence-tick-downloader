# Builds installers for Windows and macOS, plus an MSIX for the Microsoft Store,
# and attaches them to a draft GitHub Release. Runs when a version tag is
# pushed: git tag v0.1.0 && git push --tags
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal macOS build needs both Apple targets.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Trandence Tick Downloader ${{ github.ref_name }}'
          releaseBody: 'Download the installer for your system below.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Microsoft Store package: the release exe tauri-action just built, packed
      # as MSIX (scripts/pack-msix.py). Unsigned on purpose — the Store signs it —
      # so it is for uploading to Partner Center, not for installing directly.
      - name: MSIX for the Microsoft Store
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --quiet pillow
          python scripts/pack-msix.py --out msix-out
          $file = Get-ChildItem msix-out -Filter *.msix | Select-Object -First 1
          gh api --method POST `
            -H "Content-Type: application/octet-stream" `
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.tauri.outputs.releaseId }}/assets?name=$($file.Name)" `
            --input $file.FullName | Out-Null
          Write-Output "Uploaded $($file.Name)"
